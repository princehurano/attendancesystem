<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Attendance Monitoring System</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <div class="masthead">
    <div>
      <div class="masthead-title">Attendance Monitoring System</div>
      <div class="masthead-sub">Daily roll &middot; Class records &middot; Student summaries</div>
    </div>
    <div class="masthead-date">
      <strong id="todayLabel">&mdash;</strong>
      <span id="signedInLabel">Teacher view</span>
    </div>
  </div>

  <div class="tabs" role="tablist">
    <button class="tab active" data-tab="take" role="tab">Take Attendance</button>
    <button class="tab" data-tab="daily" role="tab">Daily Records</button>
    <button class="tab" data-tab="summary" role="tab">Student Summary</button>
  </div>

  <div class="panel" id="panel"></div>

  <footer class="note">
    Demo build &mdash; data is generated for illustration and lives only in this browser tab.<br/>
    Refreshing the page will reset all records back to the sample dataset.
  </footer>
</div>

<script src="script.js">


</script>

</body>
</html>
